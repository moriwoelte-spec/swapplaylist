name: Build APK

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Project Files
        run: |
          rm -rf TuneSwap temp_extract
          mkdir -p temp_extract
          
          # Suche nach jeder hochgeladenen .zip Datei im Repo
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Entpacke $ZIP_FILE..."
            unzip -o -q "$ZIP_FILE" -d temp_extract
          else
            echo "Keine ZIP-Datei gefunden, nutze Repository-Inhalt direkt"
            cp -r . temp_extract/
          fi
          
          # Finde heraus, in welchem Ordner die build.gradle/settings.gradle liegt
          GRADLE_DIR=$(find temp_extract -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          
          if [ -n "$GRADLE_DIR" ]; then
            mkdir -p TuneSwap
            cp -r "$GRADLE_DIR"/* TuneSwap/
          else
            echo "Fehler: Keine Gradle-Dateien gefunden!"
            exit 1
          fi

      - name: Build Debug APK
        env:
          SPOTIFY_ID: ${{ secrets.SPOTIFY_ID }}
          GOOGLE_ID: ${{ secrets.GOOGLE_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
        run: cd TuneSwap && gradle assembleDebug --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v${{ github.run_number }} TuneSwap/app/build/outputs/apk/debug/app-debug.apk --title "APK ${{ github.run_number }}" --notes "Automated release build number ${{ github.run_number }}"
