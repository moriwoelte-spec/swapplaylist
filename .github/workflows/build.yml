name: Build APK

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Extract Project
        run: |
          rm -rf TuneSwap
          mkdir -p temp_extracted
          unzip -o -q TuneSwap*.zip -d temp_extracted
          if [ -d "temp_extracted/TuneSwap" ]; then
            mv temp_extracted/TuneSwap TuneSwap
          else
            mv temp_extracted TuneSwap
          fi
          rm -rf temp_extracted

      - env:
          SPOTIFY_ID: ${{ secrets.SPOTIFY_ID }}
          GOOGLE_ID: ${{ secrets.GOOGLE_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
        run: cd TuneSwap && gradle assembleDebug --no-daemon

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v${{ github.run_number }} TuneSwap/app/build/outputs/apk/debug/app-debug.apk --title "APK ${{ github.run_number }}" --notes "Automated release build number ${{ github.run_number }}"
